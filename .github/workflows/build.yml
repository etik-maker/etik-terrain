name: Compilation APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler
        run: gradle assembleRelease --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk EtikTerrain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EtikTerrain-apk
          path: EtikTerrain.apk
      - name: Publier l'APK dans la branche apk
        run: |
          mkdir /tmp/apk && cp EtikTerrain.apk /tmp/apk/
          cd /tmp/apk
          echo "APK compilé depuis ${GITHUB_SHA} le $(date -u +%Y-%m-%dT%H:%MZ)" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
