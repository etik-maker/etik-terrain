name: Compilation APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler
        run: gradle assembleRelease --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk EtikTerrain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EtikTerrain-apk
          path: EtikTerrain.apk
